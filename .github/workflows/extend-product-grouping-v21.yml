name: Extend MB1 Product Grouping V21

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extend-product-grouping-v21.yml'

permissions:
  contents: write

jobs:
  extend-grouping:
    runs-on: ubuntu-latest
    steps:
      - name: Check out catalog
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build additional grouped-product configuration and update grouping layer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          groups = []

          # Split Scroll A-Z: MB1-0697 through MB1-0722.
          split_variants = []
          for i, letter in enumerate('ABCDEFGHIJKLMNOPQRSTUVWXYZ', start=1):
              design = f'{696+i:04d}'
              split_variants.append({
                  'design': design,
                  'label': f'Letter {letter}',
                  'sort': i,
                  'primary': i == 1,
                  'visible': True,
              })
          groups.append({
              'id': 'MB1-GROUP-021',
              'name': 'Split Scroll Letter Signs',
              'group': 'Split Scroll Alphabet',
              'variantType': 'Letter',
              'primaryDesign': '0697',
              'variants': split_variants,
          })

          # Steampunk A-Z. MB1-0736 is Steampunk Mr and Mrs and intentionally remains standalone.
          steampunk_ids = [f'{n:04d}' for n in range(723, 736)] + [f'{n:04d}' for n in range(737, 750)]
          steampunk_variants = []
          for i, (letter, design) in enumerate(zip('ABCDEFGHIJKLMNOPQRSTUVWXYZ', steampunk_ids), start=1):
              steampunk_variants.append({
                  'design': design,
                  'label': f'Letter {letter}',
                  'sort': i,
                  'primary': i == 1,
                  'visible': True,
              })
          groups.append({
              'id': 'MB1-GROUP-022',
              'name': 'Steampunk Letter Monogram Signs',
              'group': 'Steampunk Alphabet',
              'variantType': 'Letter',
              'primaryDesign': '0723',
              'variants': steampunk_variants,
          })

          # Bee and honeycomb designs: six Bee Honeycomb designs plus thirty Bees and Honeycomb designs.
          bee_variants = []
          sort = 1
          for n, design_num in enumerate(range(70, 76), start=1):
              bee_variants.append({
                  'design': f'{design_num:04d}',
                  'label': f'Bee Honeycomb {n}',
                  'sort': sort,
                  'primary': sort == 1,
                  'visible': True,
              })
              sort += 1
          for n, design_num in enumerate(range(76, 106), start=1):
              bee_variants.append({
                  'design': f'{design_num:04d}',
                  'label': f'Bees & Honeycomb {n}',
                  'sort': sort,
                  'primary': False,
                  'visible': True,
              })
              sort += 1
          groups.append({
              'id': 'MB1-GROUP-023',
              'name': 'Bee & Honeycomb Signs',
              'group': 'Bee and Honeycomb Collection',
              'variantType': 'Style',
              'primaryDesign': '0070',
              'variants': bee_variants,
          })

          # Classic cars/trucks: sixteen car-front-end designs plus five generic hot-rod/truck designs.
          # General Lee is intentionally not included in this grouped storefront item.
          car_front = [
              ('0106','Car Front End 1'),
              ('0114','Car Front End 2'),
              ('0115','Car Front End 3'),
              ('0116','Car Front End 4'),
              ('0117','Car Front End 5'),
              ('0118','Car Front End 6'),
              ('0119','Car Front End 7'),
              ('0120','Car Front End 8'),
              ('0121','Car Front End 9'),
              ('0107','Car Front End 10'),
              ('0108','Car Front End 11'),
              ('0109','Car Front End 12'),
              ('0110','Car Front End 13'),
              ('0111','Car Front End 14'),
              ('0112','Car Front End 15'),
              ('0113','Car Front End 16'),
              ('0971','Hot Rod Truck'),
              ('0972','Hot Rod with Flames'),
              ('0973','Hot Rod'),
              ('0974','Hot Rod 2'),
              ('0975','Hot Rod Front View'),
          ]
          vehicle_variants = []
          for i, (design, label) in enumerate(car_front, start=1):
              vehicle_variants.append({
                  'design': design,
                  'label': label,
                  'sort': i,
                  'primary': i == 1,
                  'visible': True,
              })
          groups.append({
              'id': 'MB1-GROUP-024',
              'name': 'Classic Cars & Trucks Signs',
              'group': 'Classic Cars and Trucks Collection',
              'variantType': 'Style',
              'primaryDesign': '0106',
              'variants': vehicle_variants,
          })

          config = {
              'version': 21,
              'generatedFrom': 'MB1 catalog grouping expansion requested 2026-09-16',
              'groupCount': len(groups),
              'groups': groups,
          }
          Path('catalog-groups-v21.json').write_text(json.dumps(config, indent=2) + '\n', encoding='utf-8')

          js_path = Path('monogram-grouping-v20.js')
          js = js_path.read_text(encoding='utf-8')

          old_lookup = "const p=key.startsWith('MB1-MONO-')?buildDisplayProducts().find(x=>x._mb1Grouped&&x.groupId===key):(PRODUCTS||[]).find(x=>norm(x.design)===norm(key));"
          new_lookup = "const p=groupById.has(key)?buildDisplayProducts().find(x=>x._mb1Grouped&&x.groupId===key):(PRODUCTS||[]).find(x=>norm(x.design)===norm(key));"
          if old_lookup in js:
              js = js.replace(old_lookup, new_lookup, 1)
          elif new_lookup not in js:
              raise SystemExit('Could not locate grouped-card lookup in monogram-grouping-v20.js')

          old_fetch = """  fetch('monogram-groups-v20.json?v=20')
    .then(r=>{if(!r.ok)throw new Error('Grouping config '+r.status);return r.json();})
    .then(cfg=>{CONFIG=cfg;buildMaps();applyOverrides();})
    .catch(err=>console.warn('MB1 monogram grouping not loaded:',err));"""
          new_fetch = """  Promise.all([
    fetch('monogram-groups-v20.json?v=20').then(r=>{if(!r.ok)throw new Error('Monogram grouping config '+r.status);return r.json();}),
    fetch('catalog-groups-v21.json?v=21').then(r=>{if(!r.ok)throw new Error('Catalog grouping config '+r.status);return r.json();})
  ])
    .then(([baseCfg,extraCfg])=>{
      CONFIG={version:21,groups:[...(baseCfg.groups||[]),...(extraCfg.groups||[])]};
      buildMaps();
      applyOverrides();
    })
    .catch(err=>console.warn('MB1 product grouping not loaded:',err));"""
          if old_fetch in js:
              js = js.replace(old_fetch, new_fetch, 1)
          elif "catalog-groups-v21.json?v=21" not in js:
              raise SystemExit('Could not locate V20 config loader in monogram-grouping-v20.js')

          if '/* MB1 Monogram Grouping V20' in js and 'V21 EXPANSION' not in js:
              js = js.replace('/* MB1 Monogram Grouping V20', '/* MB1 Monogram Grouping V20 · V21 EXPANSION', 1)

          js_path.write_text(js, encoding='utf-8')
          PY

      - name: Verify the new group definitions and protected behavior
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          cfg = json.loads(Path('catalog-groups-v21.json').read_text(encoding='utf-8'))
          assert cfg['groupCount'] == 4
          by_id = {g['id']: g for g in cfg['groups']}
          assert len(by_id['MB1-GROUP-021']['variants']) == 26
          assert len(by_id['MB1-GROUP-022']['variants']) == 26
          assert '0736' not in {v['design'] for v in by_id['MB1-GROUP-022']['variants']}
          assert len(by_id['MB1-GROUP-023']['variants']) == 36
          assert len(by_id['MB1-GROUP-024']['variants']) == 21
          assert '0950' not in {v['design'] for v in by_id['MB1-GROUP-024']['variants']}

          js = Path('monogram-grouping-v20.js').read_text(encoding='utf-8')
          for token in [
              "catalog-groups-v21.json?v=21",
              'groupById.has(key)',
              'updateCheckout()',
              'renderGallery(d)',
              'putDesignInAddressBar',
              'updateCustomizeLink()',
          ]:
              assert token in js, token
          print('V21 grouped-product expansion verification passed.')
          PY

      - name: Commit grouped-product expansion
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'V21 expansion is already installed; no commit needed.'
            exit 0
          fi
          git config user.name 'MB1 Catalog Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add monogram-grouping-v20.js catalog-groups-v21.json
          git commit -m 'compress steampunk split scroll bees and classic vehicle designs'
          git push origin main
